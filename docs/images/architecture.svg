<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 940" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#00e5ff" stroke-opacity="0.05"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#00e5ff" fill-opacity="0.8"/>
    </marker>
  </defs>

  <rect width="1440" height="940" fill="#070a14"/>
  <rect width="1440" height="940" fill="url(#grid)"/>

  <!-- header -->
  <text x="60" y="64" font-size="30" font-weight="700" letter-spacing="2" fill="#00e5ff">CYBERVERSE · SYSTEM ARCHITECTURE</text>
  <text x="60" y="92" font-size="15" fill="#8a93ab">Educational cybersecurity simulation platform — Next.js 15 · FastAPI · PostgreSQL 16 · Redis · Celery · Docker</text>

  <!-- ============ CLIENTS ============ -->
  <rect x="60" y="120" width="340" height="240" rx="12" fill="none" stroke="#00e5ff" stroke-opacity="0.35" stroke-dasharray="6 4"/>
  <text x="76" y="146" font-size="13" letter-spacing="2" fill="#00e5ff">CLIENTS</text>

  <rect x="80" y="168" width="300" height="74" rx="10" fill="#0d1220" stroke="#00e5ff" stroke-opacity="0.55"/>
  <text x="100" y="196" font-size="16" font-weight="700" fill="#e6e9f2">Students &amp; Instructors</text>
  <text x="100" y="218" font-size="13" fill="#8a93ab">Browser · PWA-ready</text>

  <rect x="80" y="262" width="300" height="74" rx="10" fill="#0d1220" stroke="#00e5ff" stroke-opacity="0.55"/>
  <text x="100" y="290" font-size="16" font-weight="700" fill="#e6e9f2">Web Application</text>
  <text x="100" y="312" font-size="13" fill="#8a93ab">Next.js 15 · React 19 · Tailwind · Framer</text>

  <line x1="230" y1="242" x2="230" y2="258" stroke="#00e5ff" stroke-opacity="0.8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="380" y1="205" x2="452" y2="205" stroke="#00e5ff" stroke-opacity="0.8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ============ EDGE ============ -->
  <rect x="460" y="120" width="200" height="240" rx="12" fill="none" stroke="#00e5ff" stroke-opacity="0.35" stroke-dasharray="6 4"/>
  <text x="476" y="146" font-size="13" letter-spacing="2" fill="#00e5ff">EDGE</text>

  <rect x="480" y="168" width="160" height="120" rx="10" fill="#0d1220" stroke="#00e5ff" stroke-opacity="0.55"/>
  <text x="500" y="198" font-size="17" font-weight="700" fill="#e6e9f2">Caddy</text>
  <text x="500" y="222" font-size="13" fill="#8a93ab">Reverse proxy</text>
  <text x="500" y="242" font-size="13" fill="#8a93ab">TLS · headers</text>
  <text x="500" y="262" font-size="13" fill="#8a93ab">gzip · limits</text>

  <line x1="640" y1="215" x2="692" y2="215" stroke="#00e5ff" stroke-opacity="0.8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ============ BACKEND ============ -->
  <rect x="700" y="120" width="420" height="360" rx="12" fill="none" stroke="#00e5ff" stroke-opacity="0.35"/>
  <text x="716" y="146" font-size="13" letter-spacing="2" fill="#00e5ff">BACKEND · FASTAPI (PYTHON 3.12)</text>

  <rect x="720" y="168" width="380" height="96" rx="10" fill="#0d1220" stroke="#00e5ff" stroke-opacity="0.6"/>
  <text x="740" y="194" font-size="16" font-weight="700" fill="#e6e9f2">REST API · /api/v1</text>
  <text x="740" y="218" font-size="13" fill="#8a93ab">JWT + refresh tokens · role-based access (RBAC)</text>
  <text x="740" y="238" font-size="13" fill="#8a93ab">Rate limiting (Redis) · audit logging · 2FA ready</text>

  <rect x="720" y="284" width="380" height="80" rx="10" fill="#0d1220" stroke="#7c4dff" stroke-opacity="0.6"/>
  <text x="740" y="310" font-size="16" font-weight="700" fill="#e6e9f2">AI Mentor (LLM)</text>
  <text x="740" y="334" font-size="13" fill="#8a93ab">Adaptive tutoring · hints · explanations · review</text>

  <rect x="720" y="384" width="380" height="80" rx="10" fill="#0d1220" stroke="#00e676" stroke-opacity="0.6"/>
  <text x="740" y="410" font-size="16" font-weight="700" fill="#e6e9f2">Celery Workers</text>
  <text x="740" y="434" font-size="13" fill="#8a93ab">Emails · notifications · analytics · streaks</text>

  <line x1="910" y1="264" x2="910" y2="280" stroke="#7c4dff" stroke-opacity="0.8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="990" y1="264" x2="990" y2="380" stroke="#00e676" stroke-opacity="0.8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ============ DATA ============ -->
  <rect x="1140" y="120" width="240" height="360" rx="12" fill="none" stroke="#00e5ff" stroke-opacity="0.35"/>
  <text x="1156" y="146" font-size="13" letter-spacing="2" fill="#00e5ff">DATA</text>

  <rect x="1160" y="168" width="200" height="90" rx="10" fill="#0d1220" stroke="#00e5ff" stroke-opacity="0.55"/>
  <text x="1180" y="196" font-size="16" font-weight="700" fill="#e6e9f2">PostgreSQL 16</text>
  <text x="1180" y="220" font-size="13" fill="#8a93ab">Courses · missions · progress</text>
  <text x="1180" y="240" font-size="13" fill="#8a93ab">XP · leaderboards · plans</text>

  <rect x="1160" y="278" width="200" height="90" rx="10" fill="#0d1220" stroke="#00e5ff" stroke-opacity="0.55"/>
  <text x="1180" y="306" font-size="16" font-weight="700" fill="#e6e9f2">Redis</text>
  <text x="1180" y="330" font-size="13" fill="#8a93ab">Cache · sessions</text>
  <text x="1180" y="350" font-size="13" fill="#8a93ab">Rate limits · Celery broker</text>

  <rect x="1160" y="388" width="200" height="76" rx="10" fill="#0d1220" stroke="#00e5ff" stroke-opacity="0.55"/>
  <text x="1180" y="416" font-size="16" font-weight="700" fill="#e6e9f2">Object Storage</text>
  <text x="1180" y="440" font-size="13" fill="#8a93ab">Media · certificates</text>

  <line x1="1100" y1="213" x2="1156" y2="213" stroke="#00e5ff" stroke-opacity="0.8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1100" y1="323" x2="1156" y2="323" stroke="#00e5ff" stroke-opacity="0.8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1100" y1="426" x2="1156" y2="426" stroke="#00e5ff" stroke-opacity="0.8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ============ DEVOPS ============ -->
  <rect x="60" y="520" width="1320" height="360" rx="12" fill="none" stroke="#7c4dff" stroke-opacity="0.45" stroke-dasharray="6 4"/>
  <text x="76" y="548" font-size="13" letter-spacing="2" fill="#7c4dff">DEVOPS · CI/CD (GITHUB ACTIONS)</text>

  <rect x="80" y="576" width="400" height="110" rx="10" fill="#0d1220" stroke="#7c4dff" stroke-opacity="0.55"/>
  <text x="100" y="602" font-size="15" font-weight="700" fill="#e6e9f2">1 · Quality Gate</text>
  <text x="100" y="626" font-size="13" fill="#8a93ab">ruff · black · mypy (backend)</text>
  <text x="100" y="646" font-size="13" fill="#8a93ab">vitest · tsc · next lint (frontend)</text>
  <text x="100" y="666" font-size="13" fill="#8a93ab">pytest + Postgres service (backend)</text>

  <rect x="520" y="576" width="400" height="110" rx="10" fill="#0d1220" stroke="#7c4dff" stroke-opacity="0.55"/>
  <text x="540" y="602" font-size="15" font-weight="700" fill="#e6e9f2">2 · Build &amp; Scan</text>
  <text x="540" y="626" font-size="13" fill="#8a93ab">Docker images → GHCR (tagged by sha)</text>
  <text x="540" y="646" font-size="13" fill="#8a93ab">Trivy — vulnerability scan (HIGH/CRITICAL)</text>
  <text x="540" y="666" font-size="13" fill="#8a93ab">gitleaks — secret scanning</text>

  <rect x="960" y="576" width="400" height="110" rx="10" fill="#0d1220" stroke="#7c4dff" stroke-opacity="0.55"/>
  <text x="980" y="602" font-size="15" font-weight="700" fill="#e6e9f2">3 · Deploy</text>
  <text x="980" y="626" font-size="13" fill="#8a93ab">Vercel — frontend (staging + prod)</text>
  <text x="980" y="646" font-size="13" fill="#8a93ab">Render — backend API (staging + prod)</text>
  <text x="980" y="666" font-size="13" fill="#8a93ab">Managed PostgreSQL · Redis add-on</text>

  <rect x="80" y="714" width="400" height="110" rx="10" fill="#0d1220" stroke="#00e676" stroke-opacity="0.65"/>
  <text x="100" y="740" font-size="15" font-weight="700" fill="#00e676">Safe Training Labs</text>
  <text x="100" y="764" font-size="13" fill="#8a93ab">Sandboxed simulations inside CyberVerse</text>
  <text x="100" y="784" font-size="13" fill="#8a93ab">Owned + explicitly authorized targets only</text>
  <text x="100" y="804" font-size="13" fill="#8a93ab">Full audit trail · no real third parties</text>

  <rect x="520" y="714" width="400" height="110" rx="10" fill="#0d1220" stroke="#00e676" stroke-opacity="0.65"/>
  <text x="540" y="740" font-size="15" font-weight="700" fill="#00e676">Neo Analysis — Virtual Internet</text>
  <text x="540" y="764" font-size="13" fill="#8a93ab">Fictional companies, users, devices, threats</text>
  <text x="540" y="784" font-size="13" fill="#8a93ab">Dynamic AI world reacting to player actions</text>
  <text x="540" y="804" font-size="13" fill="#8a93ab">Incident response · forensics · hardening</text>

  <rect x="960" y="714" width="400" height="110" rx="10" fill="#0d1220" stroke="#7c4dff" stroke-opacity="0.55"/>
  <text x="980" y="740" font-size="15" font-weight="700" fill="#e6e9f2">Observability</text>
  <text x="980" y="764" font-size="13" fill="#8a93ab">Structured JSON logging (Sentry-ready)</text>
  <text x="980" y="784" font-size="13" fill="#8a93ab">Audit events for admin &amp; instructors</text>
  <text x="980" y="804" font-size="13" fill="#8a93ab">Health endpoints · uptime checks</text>

  <!-- footer -->
  <text x="60" y="916" font-size="13" fill="#8a93ab">All practical activities run in fictional, sandboxed environments owned by CyberVerse — real third-party systems are never targeted.</text>
</svg>
