# CyberVerse development stack (hot-reload)
version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cyberverse
      POSTGRES_PASSWORD: cyberverse
      POSTGRES_DB: cyberverse
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_dev:/data

  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ../backend:/app
    environment:
      DATABASE_URL: postgresql://cyberverse:cyberverse@postgres:5432/cyberverse
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      DEBUG: "true"
      ENVIRONMENT: development
    depends_on:
      - postgres
      - redis
    ports:
      - "8000:8000"

  celery-worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    command: celery -A app.core.celery_app.celery_app worker --loglevel=INFO
    volumes:
      - ../backend:/app
    environment:
      DATABASE_URL: postgresql://cyberverse:cyberverse@postgres:5432/cyberverse
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    depends_on:
      - postgres
      - redis

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    command: npm run dev
    volumes:
      - ../frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  postgres_dev:
  redis_dev:
  frontend_node_modules: