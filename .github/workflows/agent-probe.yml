# Temporary diagnostic workflow: reports Vercel project + env var NAMES only.
# Never prints secret values.
name: Agent Probe

on:
  push:
    branches: ["agent/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Probe Vercel
        run: |
          set -uo pipefail
          echo "== token fingerprint (non-secret) =="
          python3 -c "import os;t=os.environ['VERCEL_TOKEN'];print('len=',len(t));print('prefix=',t[:4]);print('suffix=',t[-2:]);print('has_ws=',any(c.isspace() for c in t))"
          echo "== /v2/user with UA =="
          curl -s -w "\nHTTP=%{http_code}\n" "https://api.vercel.com/v2/user" -H "Authorization: Bearer $VERCEL_TOKEN" -H "User-Agent: cyberverse-ci-probe/1.0" | head -c 400
          echo "== /v9/projects no team =="
          curl -s -w "\nHTTP=%{http_code}\n" "https://api.vercel.com/v9/projects?limit=20" -H "Authorization: Bearer $VERCEL_TOKEN" -H "User-Agent: cyberverse-ci-probe/1.0" | head -c 400
          echo "== vercel CLI whoami (no scope) =="
          npx --yes vercel@latest whoami --token "$VERCEL_TOKEN" 2>&1 | grep -v "NOTE: The Vercel CLI now collects" | head -8
          echo "== vercel CLI project ls (no scope) =="
          npx --yes vercel@latest project ls --token "$VERCEL_TOKEN" 2>&1 | grep -v "NOTE: The Vercel CLI now collects" | head -20
