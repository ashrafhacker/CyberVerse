# Temporary diagnostic workflow: reports Vercel project + env var NAMES only.
# Never prints secret values.
name: Agent Probe

on:
  push:
    branches: ["agent/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Probe Vercel
        run: |
          set -uo pipefail
          for u in "/v2/user" "/v2/teams?limit=20" "/v9/projects?limit=50&teamId=$VERCEL_ORG_ID" "/v9/projects/$VERCEL_PROJECT_ID/env?teamId=$VERCEL_ORG_ID"; do
            code=$(curl -s -o /tmp/o.json -w "%{http_code}" "https://api.vercel.com$u" -H "Authorization: Bearer $VERCEL_TOKEN")
            echo "--- $u -> $code"
            head -c 600 /tmp/o.json; echo
          done
          echo "== vercel CLI whoami =="
          npx --yes vercel@latest whoami --token "$VERCEL_TOKEN" 2>&1 | head -5 || true
          echo "== vercel CLI project list =="
          npx --yes vercel@latest project ls --token "$VERCEL_TOKEN" --scope "$VERCEL_ORG_ID" 2>&1 | head -20 || true
