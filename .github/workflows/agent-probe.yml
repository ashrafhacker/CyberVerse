# Temporary diagnostic workflow: reports Vercel project + env var NAMES only.
# Never prints secret values.
name: Agent Probe

on:
  push:
    branches: ["agent/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Probe Vercel
        env:
          MODE: "push"
        run: |
          set -euo pipefail
          echo "== Vercel API reachable =="
          curl -s -o /dev/null -w "status=%{http_code}\n" https://api.vercel.com/v2/user \
            -H "Authorization: Bearer $VERCEL_TOKEN"

          echo "== Teams =="
          curl -s "https://api.vercel.com/v2/teams?limit=20" \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            | python3 -c "import sys,json;d=json.load(sys.stdin);[print(t.get('id'),t.get('slug'),t.get('name')) for t in d.get('teams',[])]"

          echo "== Projects in org =="
          curl -s "https://api.vercel.com/v9/projects?limit=50&teamId=$VERCEL_ORG_ID" \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            | python3 -c "
import sys,json
d=json.load(sys.stdin)
for p in d.get('projects',[]):
    print(p.get('id'), '|', p.get('name'), '| framework=', p.get('framework'), '| root=', (p.get('rootDirectory') or '-'), '| node=', (p.get('nodeVersion') or '-'))
"

          echo "== Env var NAMES for target project =="
          curl -s "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID/env?teamId=$VERCEL_ORG_ID" \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            | python3 -c "
import sys,json
d=json.load(sys.stdin)
envs=d.get('envs', d if isinstance(d,list) else [])
for e in envs:
    val=e.get('value') or ''
    ids=e.get('target') or []
    print(f\"{e.get('key')} | target={ids} | set={bool(val)} | len={len(val)}\")
"
